<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="256,32 452,144 452,368 256,480 60,368 60,144" fill="#13121d" stroke="url(#gemGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner facet decoration -->
  <polygon points="256,64 424,160 424,352 256,448 88,352 88,160" fill="#1c1a2e" stroke="#ffffff15" stroke-width="4"/>

  <!-- Glowing core crystal -->
  <polygon points="256,120 330,210 256,360 182,210" fill="url(#gemGrad)" opacity="0.85"/>
  <polygon points="256,120 256,360 182,210" fill="#ffffff20"/>

  <!-- Pickaxe Head -->
  <path d="M 170 120 C 230 80, 282 80, 342 120 C 352 126, 350 140, 338 140 C 298 126, 214 126, 174 140 C 162 140, 160 126, 170 120 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Pickaxe Handle -->
  <rect x="246" y="130" width="20" height="260" rx="6" fill="#854d0e" stroke="url(#goldGrad)" stroke-width="4" transform="rotate(-35 256 260)"/>
  <rect x="242" y="126" width="28" height="30" rx="4" fill="url(#goldGrad)" transform="rotate(-35 256 260)"/>

  <!-- Stars / Sparkles -->
  <path d="M 140 190 Q 155 190 155 175 Q 155 190 170 190 Q 155 190 155 205 Q 155 190 140 190 Z" fill="#fbbf24"/>
  <path d="M 350 310 Q 365 310 365 295 Q 365 310 380 310 Q 365 310 365 325 Q 365 310 350 310 Z" fill="#38bdf8"/>
  <path d="M 360 170 Q 370 170 370 160 Q 370 170 380 170 Q 370 170 370 180 Q 370 170 360 170 Z" fill="#f43f5e"/>
</svg>
